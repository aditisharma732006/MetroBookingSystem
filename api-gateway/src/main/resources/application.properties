# reads JWT_SECRET from the .env file in the project root (same folder as pom.xml)
spring.config.import=optional:file:.env[.properties]

spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

jwt.secret=${JWT_SECRET}

# ---------------------------------------------------------------
# ROUTES
# The prefix is spring.cloud.gateway.server.webflux.*
# (Spring Cloud Gateway 5 on Spring Boot 4). The old spring.cloud.gateway.*
# keys are silently ignored, so the gateway starts but routes nothing (404).
# ---------------------------------------------------------------

# auth-service (also carries the Google OAuth2 start and callback paths)
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**,/oauth2/**,/login/oauth2/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=Retry
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.retries=3
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.methods=GET
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.statuses=BAD_GATEWAY

# station-service
spring.cloud.gateway.server.webflux.routes[1].id=station-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://STATION-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/stations/**,/lines/**,/segments/**,/fare-slabs/**,/route/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=Retry
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.retries=3
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.methods=GET
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.statuses=BAD_GATEWAY

# booking-service (POST /bookings is never retried)
spring.cloud.gateway.server.webflux.routes[2].id=booking-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/bookings/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=Retry
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.retries=3
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.methods=GET
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.statuses=BAD_GATEWAY

# NEW: payment-service. No Retry filter: the user tapping Pay again is the retry,
# and a retried GET would call Razorpay again each time.
spring.cloud.gateway.server.webflux.routes[3].id=payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/payments/**

# ---------------------------------------------------------------
# SWAGGER (dev only): each service's API docs, reached through the gateway
# ---------------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[4].id=auth-docs
spring.cloud.gateway.server.webflux.routes[4].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/auth-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/auth-service/v3/api-docs, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[5].id=station-docs
spring.cloud.gateway.server.webflux.routes[5].uri=lb://STATION-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/station-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/station-service/v3/api-docs, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[6].id=booking-docs
spring.cloud.gateway.server.webflux.routes[6].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/booking-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[6].filters[0]=RewritePath=/booking-service/v3/api-docs, /v3/api-docs

# NEW: payment-service docs (only works once Payment has springdoc in its pom)
spring.cloud.gateway.server.webflux.routes[7].id=payment-docs
spring.cloud.gateway.server.webflux.routes[7].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/payment-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[7].filters[0]=RewritePath=/payment-service/v3/api-docs, /v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/auth-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=station-service
springdoc.swagger-ui.urls[1].url=/station-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=booking-service
springdoc.swagger-ui.urls[2].url=/booking-service/v3/api-docs
# NEW
springdoc.swagger-ui.urls[3].name=payment-service
springdoc.swagger-ui.urls[3].url=/payment-service/v3/api-docs

# ---------------------------------------------------------------
# CORS
# ---------------------------------------------------------------
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

# ---------------------------------------------------------------
# TIMEOUTS
# ---------------------------------------------------------------
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s