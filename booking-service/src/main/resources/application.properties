spring.config.import=optional:file:.env[.properties]
spring.application.name=booking-service
server.port=8083

# Eureka (hostname/url can be overridden by environment variables, no file edit needed)
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.datasource.url=jdbc:mysql://localhost:3306/booking_service_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

#feign
#wait for connection
spring.cloud.openfeign.client.config.default.connect-timeout=1000
#wait for response
spring.cloud.openfeign.client.config.default.read-timeout=1500

#Scheduler
booking.expiry.minutes=15
booking.expiry.check-rate-ms=60000

# Kafka connection
spring.kafka.bootstrap-servers=localhost:9092

# Producer
#kafka stores bytes, this line converts the string key to bytes
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Fail fast: if Kafka is down, send() gives up in about 3 seconds instead of blocking for 60.
# NEW: max.block.ms is the one that was missing. It limits how long send() waits for broker metadata.
# Keep all of these below the gateway response-timeout (5s).
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=1000
spring.kafka.producer.properties.delivery.timeout.ms=1500

#The first converts the event object to JSON bytes.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false