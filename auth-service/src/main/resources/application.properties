spring.config.import=optional:file:.env[.properties]
spring.application.name=auth-service
server.port=8082

eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}

# CHANGED: secrets now come from environment variables, not the file (see "Setting the variables" below)
spring.datasource.url=jdbc:mysql://localhost:3306/auth_service_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# NEW: without timeouts a dead mail server can hang register forever (names from memory, verify)
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
spring.mail.properties.mail.debug=true

#http://localhost:8082/swagger-ui.html

# CHANGED: same value in Auth, Gateway, Booking, Station. Used as RAW TEXT (not Base64-decoded).
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

#OAuth2
spring.security.oauth2.client.registration.google.client-id=425892621526-vn6bcm5rf6nnb6pfg5askld9bb3mmk6t.apps.googleusercontent.com
# CHANGED: use the NEW secret after resetting it in Google Cloud Console
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

#api gateway public address
app.gateway.base-url=http://localhost:8080

#where req originally came from
server.forward-headers-strategy=framework